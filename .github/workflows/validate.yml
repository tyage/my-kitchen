name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validators
        run: pip install ansible ansible-lint
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Validate Ansible
        env:
          ANSIBLE_LIBRARY: ansible/library
        run: |
          ansible-playbook -i ansible/inventory.yml ansible/site.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/applications.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/deploy.yml --syntax-check
          ansible-lint ansible
      - name: Test Jellyfin reconciliation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test Jellyfin from empty volumes
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          ANSIBLE_LIBRARY: ansible/library
        run: ansible-playbook -i localhost, -c local tests/jellyfin.yml
      - name: Validate Compose
        run: ansible-playbook -i localhost, tests/compose.yml
      - name: Validate JavaScript
        run: |
          node --check compose/epgstation/config/enc.js
          bash -n compose/epgstation/docker-entrypoint.sh
