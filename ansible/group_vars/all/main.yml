---
recording_user: tyage
recording_group: tyage
compose_root: /srv/my-kitchen
recorded_root: /videos/recorded

timezone: Asia/Tokyo
tailscale_enabled: true
samba_enabled: true
samba_shares:
  - name: share
    path: /videos
  - name: recorded
    path: "{{ recorded_root }}"

# Keep application versions explicit. Test upgrades before changing these.
mirakurun_image: docker.io/chinachu/mirakurun:4.1.3
mariadb_image: docker.io/library/mariadb:11.4.13
jellyfin_image: docker.io/jellyfin/jellyfin:12.1
