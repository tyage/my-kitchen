---
- name: Install Intel media tools and drivers
  ansible.builtin.apt:
    name:
      - intel-media-va-driver-non-free
      - intel-opencl-icd
      - vainfo
    state: present

- name: Check for the Intel render device
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: intel_gpu_render_device

- name: Require Intel render device
  ansible.builtin.assert:
    that: intel_gpu_render_device.stat.exists
    fail_msg: /dev/dri/renderD128 is missing. Verify kernel support and reboot before deployment.

- name: Verify VA-API driver
  ansible.builtin.command: vainfo --display drm --device /dev/dri/renderD128
  changed_when: false
  when: not ansible_check_mode
