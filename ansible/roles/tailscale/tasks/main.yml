---
- name: Install Tailscale repository key
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'
  when: tailscale_enabled

- name: Install Tailscale apt source
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: '0644'
  when: tailscale_enabled

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: tailscale_enabled

- name: Enable Tailscale daemon
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started
  when: tailscale_enabled

- name: Enable forwarding for the Tailscale exit node
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_set: true
    reload: true
    state: present
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when:
    - tailscale_enabled
    - tailscale_ip_forwarding | default(false)

- name: Configure Tailscale enrollment and routing
  ansible.builtin.include_tasks: configure.yml
  when:
    - tailscale_enabled
    - not ansible_check_mode
