---
- name: Configure the recording host
  hosts: all
  become: true
  pre_tasks:
    - name: Check recorder before host changes
      ansible.builtin.import_tasks: tasks/require_idle.yml

    - name: Require monitoring credentials before provisioning
      ansible.builtin.assert:
        that:
          - mackerel_api_key | default('') | length > 0
        fail_msg: Supply mackerel_api_key in ansible/vault.yml or disable mackerel_enabled.
      when: mackerel_enabled
      no_log: true
  roles:
    - base
    - intel_gpu
    - tailscale
    - recording_host
    - dotfiles
    - role: mackerel
      when: mackerel_enabled
