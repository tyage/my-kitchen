name: my-kitchen

services:
  mirakc:
    image: ${MIRAKC_IMAGE:-docker.io/mirakc/mirakc:3.4.81-debian}
    container_name: mirakc
    init: true
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    ports:
      - "40772:40772"
    devices:
      - /dev/bus:/dev/bus
      - /dev/dvb:/dev/dvb
    volumes:
      - ./mirakc/config.yml:/etc/mirakc/config.yml:ro
      - ./mirakc/epg:/var/lib/mirakc/epg
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:40772/api/version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mariadb:
    image: ${MARIADB_IMAGE:-docker.io/library/mariadb:11.4}
    container_name: epgstation-mariadb
    restart: unless-stopped
    volumes:
      - ./mariadb:/var/lib/mysql
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      MARIADB_DATABASE: epgstation
      MARIADB_USER: epgstation
      MARIADB_PASSWORD: epgstation
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=false
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  epgstation:
    build:
      context: ./epgstation
      dockerfile: Dockerfile
    container_name: epgstation
    init: true
    restart: unless-stopped
    depends_on:
      mirakc:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    ports:
      - "8888:8888"
      - "8889:8889"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GROUP_ID:-44}"
      - "${RENDER_GROUP_ID:-109}"
    volumes:
      - ./epgstation/config:/app/config
      - ./epgstation/data:/app/data
      - ./epgstation/thumbnail:/app/thumbnail
      - ./epgstation/logs:/app/logs
      - ./backup:/app/backup
      - ${RECORDED_ROOT:-/videos/recorded}:/app/recorded
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/api/config"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

  jellyfin:
    profiles: ["media"]
    image: ${JELLYFIN_IMAGE:-docker.io/jellyfin/jellyfin:latest}
    container_name: jellyfin
    init: true
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GROUP_ID:-44}"
      - "${RENDER_GROUP_ID:-109}"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ${RECORDED_ROOT:-/videos/recorded}:/media/recorded:ro
    environment:
      TZ: ${TZ:-Asia/Tokyo}
